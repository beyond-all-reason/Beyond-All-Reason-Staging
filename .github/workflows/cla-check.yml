name: CLA Check

# Calls the shared CLA check for open PRs; rules for this repository live in
# .github/licensing.json.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  cla:
    uses: beyond-all-reason/licensing/.github/workflows/cla-pr.yml@single-check-row
    permissions:
      contents: read
      pull-requests: write
      statuses: write
